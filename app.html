<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e7c5a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="לידים" />
<title>לידים — מוצרי שיער</title>
<style>
  :root{
    --bg:#f4f5f4; --card:#ffffff; --card2:#f7f8f7; --line:#e5e7e5;
    --text:#1c1d1b; --muted:#6b6f6a; --faint:#9a9e98;
    --brand:#0e7c5a; --brand-bg:#e1f5ee;
    --new:#e24b4a; --new-bg:#fbeaea;
    --contact:#2f7dd1; --contact-bg:#e6f1fb;
    --follow:#c8891a; --follow-bg:#faeeda;
    --won:#1d9e75; --won-bg:#e1f5ee;
    --lost:#8a8d86; --lost-bg:#eef0ed;
    --purple:#6b5fd0; --purple-bg:#ecebfb;
    --gold:#b8860b; --gold-bg:#fdf3d6;
    --wa:#25a366;
    --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141613; --card:#1f221e; --card2:#191c17; --line:#2c302a;
      --text:#eef0ec; --muted:#a2a79e; --faint:#767b71;
      --brand:#57caa5; --brand-bg:#0f3b30;
      --new:#f0999a; --new-bg:#3d1c1c;
      --contact:#78b0e6; --contact-bg:#123049;
      --follow:#e2b05a; --follow-bg:#3a2e12;
      --won:#57caa5; --won-bg:#0f3b30;
      --lost:#a2a79e; --lost-bg:#26291f;
      --purple:#a79ef0; --purple-bg:#282350;
      --gold:#e0b64d; --gold-bg:#3a2f10;
      --wa:#2ec27a;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant","Rubik",sans-serif;
    background:var(--bg); color:var(--text);
    font-size:15px; line-height:1.5;
    overscroll-behavior:none;
  }
  #app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--bg)}
  header{
    position:sticky; top:0; z-index:20;
    background:var(--card); border-bottom:.5px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header .h-title{font-size:18px; font-weight:600}
  header .h-sub{font-size:12px; color:var(--muted); margin-top:1px}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;background:var(--brand-bg);color:var(--brand);
    font-size:19px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:0 0 auto;
  }
  main{flex:1; padding:14px 14px 90px; overflow-y:auto}
  .screen{display:none}
  .screen.active{display:block; animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px}
  .stat{background:var(--card); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow); border:.5px solid var(--line)}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat .val{font-size:26px;font-weight:600;margin-top:2px}

  .section-t{font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 8px;display:flex;align-items:center;gap:6px}
  .section-t:first-child{margin-top:0}

  .lead{
    background:var(--card); border:.5px solid var(--line); border-radius:14px;
    padding:12px 13px; margin-bottom:9px; display:flex; align-items:center; gap:11px;
    box-shadow:var(--shadow); cursor:pointer; position:relative; overflow:hidden;
  }
  .lead::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--sc,var(--line))}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:0 0 auto}
  .lead .info{flex:1;min-width:0}
  .lead .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:600;flex:0 0 auto}

  .search{width:100%;border:.5px solid var(--line);background:var(--card);color:var(--text);
    border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px;font-family:inherit}
  .search::placeholder{color:var(--faint)}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;
    padding:6px 13px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:500}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:14px}

  /* pipeline */
  .board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .board::-webkit-scrollbar{display:none}
  .col{flex:0 0 150px}
  .col-h{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;padding:0 3px}
  .col-h .cnt{background:var(--card2);border-radius:20px;padding:1px 8px;font-size:12px;color:var(--muted)}
  .pcard{background:var(--card);border:.5px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .pcard .nm{font-size:13.5px;font-weight:600}
  .pcard .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:6px}

  /* reports */
  .bar-row{margin-bottom:12px}
  .bar-lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .bar-lbl .r{color:var(--muted)}
  .bar-track{height:9px;background:var(--card2);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px}

  /* bottom nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
    background:var(--card);border-top:.5px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);z-index:30;
  }
  .nav-b{flex:1;border:none;background:none;padding:9px 0 8px;color:var(--faint);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-family:inherit}
  .nav-b .ic{font-size:22px;line-height:1}
  .nav-b.on{color:var(--brand)}
  .fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline-start:calc(50% + 240px - 74px);
    width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:28px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer;z-index:31;display:flex;align-items:center;justify-content:center}
  @media(max-width:520px){.fab{inset-inline-start:auto;inset-inline-end:18px}}

  /* detail / modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex;animation:fade .15s ease}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;border-radius:20px 20px 0 0;
    overflow-y:auto;padding:0 0 30px;animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px)}to{transform:none}}
  .sheet-top{position:sticky;top:0;background:var(--card);border-bottom:.5px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-radius:20px 20px 0 0}
  .sheet-top .x{border:none;background:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
  .d-pad{padding:16px}
  .d-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .contact-row{display:flex;gap:9px;margin-bottom:18px}
  .cbtn{flex:1;border:none;border-radius:12px;padding:12px 6px;text-align:center;font-size:12px;font-weight:600;
    cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px}
  .cbtn .ci{font-size:21px}
  .d-field{display:flex;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--line);font-size:14px}
  .d-field .k{color:var(--muted)}
  .d-field .v{font-weight:500;text-align:end}
  .status-pick{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .sp{border:.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600}
  .note{background:var(--card);border:.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
  .note .nt-d{font-size:11.5px;color:var(--faint);margin-bottom:3px}
  .note-input{width:100%;border:.5px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;
    padding:11px;font-size:14px;font-family:inherit;resize:vertical;min-height:44px}
  .btn{border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-ghost{background:var(--card);color:var(--text);border:.5px solid var(--line)}
  .row-g{display:flex;gap:9px;margin-top:10px}
  .lbl-s{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
  input[type=date],input[type=time],input[type=text],input[type=tel],input[type=email]{
    border:.5px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;
    padding:10px 12px;font-size:15px;font-family:inherit;width:100%}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:500}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="h-title" id="hTitle">לידים</div>
      <div class="h-sub" id="hSub">מוצרי שיער</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" id="setBtn" aria-label="הגדרות" style="background:var(--card2);color:var(--muted)">⚙️</button>
      <button class="icon-btn" id="bellBtn" aria-label="התראות">🔔</button>
    </div>
  </header>

  <main>
    <section class="screen active" id="s-leads"></section>
    <section class="screen" id="s-pipeline"></section>
    <section class="screen" id="s-customers"></section>
    <section class="screen" id="s-mailing"></section>
    <section class="screen" id="s-reports"></section>
  </main>

  <button class="fab" id="fab" aria-label="ליד חדש">+</button>

  <nav>
    <button class="nav-b on" data-go="leads"><span class="ic">👥</span>לידים</button>
    <button class="nav-b" data-go="pipeline"><span class="ic">🗂️</span>Pipeline</button>
    <button class="nav-b" data-go="customers"><span class="ic">📇</span>לקוחות</button>
    <button class="nav-b" data-go="mailing"><span class="ic">📤</span>דיוור</button>
    <button class="nav-b" data-go="reports"><span class="ic">📊</span>דוחות</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- Data model ---------- */
const STATUSES = [
  {id:"new",     label:"חדש",        color:"var(--new)",     bg:"var(--new-bg)"},
  {id:"contact", label:"יצרתי קשר",  color:"var(--contact)", bg:"var(--contact-bg)"},
  {id:"follow",  label:"מעקב",       color:"var(--follow)",  bg:"var(--follow-bg)"},
  {id:"won",     label:"נסגר/עסקה",  color:"var(--won)",     bg:"var(--won-bg)"},
  {id:"lost",    label:"לא רלוונטי", color:"var(--lost)",    bg:"var(--lost-bg)"},
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.id,s]));

const DEFAULT_PRODUCTS = ["צמידי שיער — שיטת הנוצה (צבוע)","צמידי שיער — שיטת הנוצה (בתולי פרימיום)","צמידי שיער — שיטת החרוז הנסתר","שיער בקראטין","יחידות שיער","שיער גזור בתולי","מוצרי החלקת מגסטיק","מוצרים נלווים"];
const DEFAULT_CAMPAIGNS = ["קמפיין קיץ 2026","קרנו אינסטגרם","רימרקטינג","מודעת סטורי"];
let SETTINGS = {products:[...DEFAULT_PRODUCTS], campaigns:[...DEFAULT_CAMPAIGNS],
  businessName:"", mailing:{dailyCap:30, cooldownDays:30, spacingSec:40}};
try{const rs=localStorage.getItem("settings_v1");if(rs)SETTINGS=Object.assign(SETTINGS,JSON.parse(rs));}catch(e){}
if(!SETTINGS.mailing) SETTINGS.mailing={dailyCap:30, cooldownDays:30, spacingSec:40};
if(!SETTINGS.catalog) SETTINGS.catalog={intro:"היי {name} 🙂 הנה קטלוג המוצרים שלנו:", link:""};
function saveSettings(){try{localStorage.setItem("settings_v1",JSON.stringify(SETTINGS));}catch(e){}}
let PRODUCTS = SETTINGS.products, CAMPAIGNS = SETTINGS.campaigns;

/* ---------- Customers / mailing model ---------- */
const REGIONS = ["צפון","חיפה","מרכז","תל אביב","ירושלים","דרום","יהודה ושומרון","לא ידוע"];
const CITY_REGION = {
  "קרית שמונה":"צפון","נהריה":"צפון","עכו":"צפון","כרמיאל":"צפון","צפת":"צפון","טבריה":"צפון","עפולה":"צפון","נצרת":"צפון","בית שאן":"צפון","מגדל העמק":"צפון","יקנעם":"צפון","מעלות":"צפון","קצרין":"צפון",
  "חיפה":"חיפה","קרית אתא":"חיפה","קרית ביאליק":"חיפה","קרית מוצקין":"חיפה","קרית ים":"חיפה","נשר":"חיפה","טירת כרמל":"חיפה","חדרה":"חיפה","אור עקיבא":"חיפה","זכרון יעקב":"חיפה",
  "תל אביב":"תל אביב","תל אביב יפו":"תל אביב","רמת גן":"תל אביב","גבעתיים":"תל אביב","בני ברק":"תל אביב","חולון":"תל אביב","בת ים":"תל אביב","הרצליה":"תל אביב","רמת השרון":"תל אביב","אור יהודה":"תל אביב","קרית אונו":"תל אביב","יהוד":"תל אביב",
  "פתח תקווה":"מרכז","ראשון לציון":"מרכז","רחובות":"מרכז","נס ציונה":"מרכז","לוד":"מרכז","רמלה":"מרכז","מודיעין":"מרכז","יבנה":"מרכז","גדרה":"מרכז","באר יעקב":"מרכז","שוהם":"מרכז","אלעד":"מרכז","ראש העין":"מרכז",
  "נתניה":"שרון","כפר סבא":"שרון","רעננה":"שרון","הוד השרון":"שרון","הרצליה פיתוח":"שרון","קדימה":"שרון","פרדס חנה":"שרון","טירה":"שרון","טייבה":"שרון","קלנסווה":"שרון",
  "ירושלים":"ירושלים","בית שמש":"ירושלים","מבשרת ציון":"ירושלים","מעלה אדומים":"ירושלים","ביתר עילית":"ירושלים",
  "באר שבע":"דרום","אשדוד":"דרום","אשקלון":"דרום","קרית גת":"דרום","קרית מלאכי":"דרום","נתיבות":"דרום","שדרות":"דרום","אופקים":"דרום","דימונה":"דרום","ערד":"דרום","אילת":"דרום","רהט":"דרום","מיתר":"דרום","אור הנר":"דרום","שגב שלום":"דרום",
  "אריאל":"יהודה ושומרון","מודיעין עילית":"יהודה ושומרון","קרית ארבע":"יהודה ושומרון","אפרת":"יהודה ושומרון","מעלה אדומים ":"יהודה ושומרון"
};
function normCity(s){return (s||"").replace(/[‎‏]/g,"").replace(/["'`]/g,"").replace(/\s+/g," ").trim();}
function cityToRegion(city){const c=normCity(city);if(!c)return "לא ידוע";if(CITY_REGION[c])return CITY_REGION[c];
  for(const k in CITY_REGION){if(c.indexOf(k)===0||k.indexOf(c)===0)return CITY_REGION[k];}return "לא ידוע";}
/* Israeli phone normalization -> {e164, valid, mobile, display} */
function normIL(raw){
  let s=(raw||"").replace(/[‎‏\s\-().]/g,"");
  if(!s)return {e164:"",valid:false,mobile:false,display:""};
  if(s[0]==="+")s=s.slice(1);
  if(s.slice(0,3)==="972")s=s.slice(3); else if(s.slice(0,5)==="00972")s=s.slice(5);
  if(s[0]==="0")s=s.slice(1);
  s=s.replace(/\D/g,"");
  const mobile=/^5\d{8}$/.test(s);
  const landline=/^(2|3|4|8|9|7\d)\d{6,7}$/.test(s);
  const valid=mobile||landline;
  return {e164:valid?("972"+s):"", valid, mobile, display: valid?("0"+s):(raw||"")};
}
const CONSENT = {
  customer:{label:"לקוח (קנה)", color:"var(--won)", bg:"var(--won-bg)", canSend:true},
  consented:{label:"נתן הסכמה", color:"var(--contact)", bg:"var(--contact-bg)", canSend:true},
  unknown:{label:"ללא הסכמה", color:"var(--follow)", bg:"var(--follow-bg)", canSend:false},
};
/* customer lifecycle status (separate from consent) */
const CUSTOMER_STATUSES = [
  {id:"new",      label:"חדש",        color:"var(--contact)", bg:"var(--contact-bg)"},
  {id:"active",   label:"פעיל",       color:"var(--won)",     bg:"var(--won-bg)"},
  {id:"repeat",   label:"לקוח חוזר",  color:"var(--purple)",  bg:"var(--purple-bg)"},
  {id:"vip",      label:"VIP",        color:"var(--gold)",    bg:"var(--gold-bg)"},
  {id:"dormant",  label:"רדום",       color:"var(--follow)",  bg:"var(--follow-bg)"},
  {id:"inactive", label:"לא פעיל",    color:"var(--lost)",    bg:"var(--lost-bg)"},
  {id:"lost",     label:"לא רלוונטי", color:"var(--new)",     bg:"var(--new-bg)"},
];
const CSTAT = Object.fromEntries(CUSTOMER_STATUSES.map(s=>[s.id,s]));
function custStat(c){return CSTAT[c.status]||CUSTOMER_STATUSES[0];}
function consentColor(c){if(c.optOut)return "var(--new)";return (CONSENT[c.consentStatus]||CONSENT.unknown).color;}
function canSendTo(c){return c && !c.optOut && CONSENT[c.consentStatus] && CONSENT[c.consentStatus].canSend && c.phoneMobile && c.phoneValid;}
/* how this customer entered the system */
const CUSTOMER_ORIGIN = [
  {id:"existing", label:"לקוח קיים מראש", icon:"🗂️"},
  {id:"lead",     label:"הגיע מליד",      icon:"🎯"},
  {id:"organic",  label:"הגיע לבד",       icon:"🚶"},
];
const ORIGIN = Object.fromEntries(CUSTOMER_ORIGIN.map(o=>[o.id,o]));
function custOrigin(c){return ORIGIN[c.origin]||ORIGIN.existing;}

let CUSTOMERS=[]; try{const rc=localStorage.getItem("customers_v1"); CUSTOMERS = rc?JSON.parse(rc):seedCustomers();}catch(e){CUSTOMERS=seedCustomers();}
function saveCustomers(){try{localStorage.setItem("customers_v1",JSON.stringify(CUSTOMERS));}catch(e){}}
function getCustomer(id){return CUSTOMERS.find(c=>c.id===id);}
function cuid(){return "c"+Math.random().toString(36).slice(2,9);}

function mkCustomer(name,phone,city,consentStatus,prod,daysSinceContact,status,origin,leadId){
  const n=normIL(phone);
  return {id:cuid(), name, phoneRaw:phone, phoneE164:n.e164, phoneValid:n.valid, phoneMobile:n.mobile,
    city:normCity(city), region:cityToRegion(city), consentStatus, status:status||"new",
    origin:origin||"existing", leadId:leadId||"", optOut:false, optOutAt:"",
    product:prod||"", tags:[], createdAt:todayISO(-(daysSinceContact||0)),
    lastContactAt: daysSinceContact==null?"":todayISO(-daysSinceContact), lastMailedAt:"", notes:[]};
}

  return false;
}
function fmtDate(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return `${+d}/${+m}`;}

window.openLead=openLead;
window.convertToCustomer=(leadId)=>{
  const l=getLead(leadId); if(!l) return;
  const n=normIL(l.phone);
  const existing=linkedCustomerForLead(l);
  if(existing){
    if(!existing.leadId) existing.leadId=leadId;
    saveCustomers(); renderAll(); openLead(leadId); toast("הליד כבר קיים ברשימת הלקוחות");
    return;
  }
  const consentStatus=l.status==="won"?"customer":"unknown";
  const status=l.status==="won"?"active":"new";
  CUSTOMERS.push({id:cuid(), name:l.name, phoneRaw:l.phone, phoneE164:n.e164, phoneValid:n.valid, phoneMobile:n.mobile,
    city:"", region:"לא ידוע", consentStatus, status, origin:"lead", leadId, optOut:false, optOutAt:"",
    product:l.product||"", tags:[], createdAt:todayISO(), lastContactAt:"", lastMailedAt:"",
    notes:[{d:todayISO(),t:"נוצר מהמרת ליד"}]});
  saveCustomers(); renderAll(); openLead(leadId);
  toast(consentStatus==="unknown"?"נוסף ללקוחות — יש לאשר הסכמה לפני דיוור":"נוסף ללקוחות ✓");
};
window.sendCatalogToLead=(id)=>{
  const l=getLead(id); if(!l||!l.phone) return;
  const msg=catalogMessage(l);
  window.open(waLink(l.phone)+"?text="+encodeURIComponent(msg),"_blank");
  l.notes=l.notes||[]; l.notes.push({d:todayISO(),t:"נשלח קטלוג מוצרים"});
  if(l.status==="new") l.status="contact";
  save(); renderAll();
  if(document.getElementById("sheetBg").classList.contains("open")) openLead(id);
  toast("הקטלוג נפתח בוואטסאפ");
};
window.closeSheet=()=>document.getElementById("sheetBg").classList.remove("open");
document.getElementById("sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")closeSheet();});

window.setStatus=(id,st)=>{const l=getLead(id);l.status=st;if(st==="won"||st==="lost")l.reminderAt="";save();openLead(id);renderAll();toast("הסטטוס עודכן");};
window.setReminder=(id,v)=>{const l=getLead(id);l.reminderAt=v;save();renderAll();toast(v?"תזכורת נקבעה":"תזכורת בוטלה");};

/* ================= CSV import wizard ================= */
const SEL="width:100%;border:.5px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:11px;font-size:15px;font-family:inherit";
let IMP=null;
function openImport(){IMP={step:1,rows:null,headers:null,map:{},consent:"customer"};renderImport();document.getElementById("sheetBg").classList.add("open");}
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=(text.split("\n")[0]||"");
  const delim=(first.split(";").length>first.split(",").length)?";":",";
  const rows=[];let row=[];let cur="";let q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===delim){row.push(cur);cur="";} else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";} else if(ch==="\r"){} else cur+=ch; }
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function guessMap(hs){const m={};hs.forEach((h,i)=>{const t=(h||"").toLowerCase();
  if(m.name==null&&/שם|name|full/.test(t))m.name=i;
  if(m.phone==null&&/טלפון|נייד|פלאפון|phone|mobile|tel|cell|מספר/.test(t))m.phone=i;
  if(m.city==null&&/עיר|יישוב|ישוב|city|town/.test(t))m.city=i;});
  if(m.phone==null&&IMP&&IMP.rows&&IMP.rows[0]){IMP.rows[0].forEach((v,i)=>{if(m.phone==null&&normIL(v).valid)m.phone=i;});}
  return m;}
window.impFile=(input)=>{const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const rows=parseCSV(r.result);if(!rows.length)throw 0;IMP.headers=rows[0].map(h=>(h||"").trim());IMP.rows=rows.slice(1).filter(rw=>rw.some(x=>x&&x.trim()));IMP.map=guessMap(IMP.headers);IMP.step=2;renderImport();}catch(e){toast("קובץ לא תקין");}};

function valOrNull(v){return v===""?null:parseInt(v,10);}

function impParseRows(){
  const seen=new Set(CUSTOMERS.map(c=>c.phoneE164).filter(Boolean));
  const fileSeen=new Set();
  let total=0,toImport=0,dupes=0,invalid=0;const preview=[];const out=[];
  IMP.rows.forEach(row=>{total++;
    const name=((IMP.map.name!=null?row[IMP.map.name]:"")||"").trim();
    const phoneRaw=((IMP.map.phone!=null?row[IMP.map.phone]:"")||"").trim();
    const city=((IMP.map.city!=null?row[IMP.map.city]:"")||"").trim();
    const n=normIL(phoneRaw);const region=cityToRegion(city);
    const rec={name,phoneRaw,display:n.valid?n.display:"",e164:n.e164,valid:n.valid,city:normCity(city),region};
    preview.push(rec);
    if(!n.valid){invalid++;return;}
    if(seen.has(n.e164)||fileSeen.has(n.e164)){dupes++;out.push({...rec,dupe:true});return;}
    fileSeen.add(n.e164);toImport++;out.push({...rec,dupe:false});
  });
  return {counts:{total,toImport,dupes,invalid},preview,out};
}
window.impCommit=()=>{
  const {out}=impParseRows();let added=0,updated=0;
  out.forEach(rec=>{if(!rec.valid)return;
    if(rec.dupe){const ex=CUSTOMERS.find(c=>c.phoneE164===rec.e164);if(ex){if(!ex.city&&rec.city){ex.city=rec.city;ex.region=rec.region;}if(ex.consentStatus==="unknown"&&IMP.consent!=="unknown")ex.consentStatus=IMP.consent;updated++;}return;}
    const n=normIL(rec.phoneRaw);
    CUSTOMERS.push({id:cuid(),name:rec.name||rec.display,phoneRaw:rec.phoneRaw,phoneE164:n.e164,phoneValid:n.valid,phoneMobile:n.mobile,city:rec.city,region:rec.region,consentStatus:IMP.consent,status:"new",origin:"existing",leadId:"",optOut:false,optOutAt:"",product:"",tags:[],createdAt:todayISO(),lastContactAt:"",lastMailedAt:"",notes:[]});
    added++;});
  saveCustomers();renderAll();closeSheet();toast("יובאו "+added+" לקוחות"+(updated?" · עודכנו "+updated:""));
};

let mailRegions=new Set(["all"]), mailStatuses=new Set(["all"]), mailBucket="all", mailTemplateId=(TEMPLATES[0]&&TEMPLATES[0].id)||"", activeBlastId=null;
function inCooldown(c){return c.lastMailedAt && daysSince(c.lastMailedAt)!=null && daysSince(c.lastMailedAt)<SETTINGS.mailing.cooldownDays;}
function buildAudience(regions,bucket,statuses){
  const allR=regions.includes("all");
  const allS=!statuses||statuses.includes("all");
  return CUSTOMERS.filter(c=>{
    if(!allR && !regions.includes(c.region)) return false;
    if(!allS && !statuses.includes(c.status||"new")) return false;
    if(bucket==="all") return true;
    if(bucket==="never") return !c.lastContactAt;
    const n=parseInt(bucket,10),d=daysSince(c.lastContactAt);
    if(!c.lastContactAt) return true;
    return d!=null && d>=n;
  });
}

window.startBlast=()=>{

function openBlast(id){activeBlastId=id;renderBlastSheet();document.getElementById("sheetBg").classList.add("open");}
function currentBlast(){return BLASTS.find(b=>b.id===activeBlastId);}
function nextPending(b){return b.recipients.findIndex(r=>r.status==="pending");}
function renderBlastSheet(){
  const b=currentBlast(); if(!b){closeSheet();return;}
  if(b.sentDate!==todayISO()){b.sentDate=todayISO();b.sentToday=0;b.capBonus=0;}
  const total=b.recipients.length, done=b.recipients.filter(r=>r.status!=="pending").length, idx=nextPending(b);
  const cap=SETTINGS.mailing.dailyCap+(b.capBonus||0);
  let inner;
  if(idx===-1){
    inner=`<div style="text-align:center;padding:30px 10px"><div style="font-size:40px">🎉</div>
      <div style="font-size:17px;font-weight:600;margin-top:8px">הדיוור הושלם!</div>

      <button class="btn btn-primary" style="margin-top:18px" onclick="closeSheet()">סגור</button></div>`;
  } else if(b.sentToday>=cap){
    inner=`<div style="text-align:center;padding:24px 10px"><div style="font-size:36px">✋</div>
      <div style="font-size:16px;font-weight:600;margin-top:8px">הגעת לתקרת היום (${cap})</div>
      <div style="color:var(--muted);margin-top:6px;font-size:13px">שליחה מדודה שומרת על המספר מחסימה. נותרו ${total-done} נמענים.</div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="closeSheet()">אמשיך מחר</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="blastOverride()">המשך בכל זאת</button></div>`;
  } else {
    const c=getCustomer(b.recipients[idx].id);
    const msg=fullMessage(b.templateSnapshot,c);
    inner=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:13px;color:var(--muted)">נשלחו היום: ${b.sentToday}/${cap}</div>
        <div style="font-size:13px;color:var(--muted)">${done}/${total}</div></div>
      <div style="height:6px;background:var(--card2);border-radius:20px;margin-bottom:14px"><div style="width:${Math.round(done/total*100)}%;height:100%;background:var(--brand);border-radius:20px"></div></div>
      <div class="d-head"><div class="avatar" style="width:44px;height:44px;color:var(--brand);background:var(--brand-bg)">${esc(initials(c.name))}</div>
        <div><div style="font-size:16px;font-weight:600">${esc(c.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(c.region)}${c.city?" · "+esc(c.city):""}</div></div></div>
      <div class="lbl-s">ההודעה (ניתן לערוך):</div>
      <textarea class="note-input" id="blastMsg" style="min-height:120px">${esc(msg)}</textarea>
      <button class="btn btn-primary" style="margin-top:12px" onclick="blastOpenWa('${c.id}')">📤 פתח וואטסאפ ושלח</button>
      <div class="row-g" style="margin-top:10px"><button class="btn btn-ghost" onclick="blastSent()">✓ נשלח — הבא</button><button class="btn btn-ghost" onclick="blastSkip()">דלג</button></div>
      <div class="row-g" style="margin-top:10px"><button class="btn btn-ghost" style="color:var(--new)" onclick="blastOptOut('${c.id}')">🚫 הסר</button><button class="btn btn-ghost" onclick="closeSheet()">עצור</button></div>`;
  }
  document.getElementById("sheet").innerHTML=`<div class="sheet-top"><div style="font-weight:600;font-size:16px">מרכז הדיוור</div><button class="x" onclick="closeSheet()">✕</button></div><div class="d-pad">${inner}</div>`;
}
window.blastOpenWa=(id)=>{const c=getCustomer(id);const box=document.getElementById("blastMsg");const b=currentBlast();const msg=box?box.value:fullMessage(b.templateSnapshot,c);window.open("https://wa.me/"+c.phoneE164+"?text="+encodeURIComponent(msg),"_blank");};
window.blastSent=()=>{const b=currentBlast();const idx=nextPending(b);if(idx<0)return;const c=getCustomer(b.recipients[idx].id);
  b.recipients[idx].status="sent";b.sentCount++;b.sentToday++;
  c.lastContactAt=todayISO();c.lastMailedAt=todayISO();c.notes=c.notes||[];c.notes.push({d:todayISO(),t:"נשלח דיוור וואטסאפ"});
  saveCustomers();saveBlasts();renderBlastSheet();renderCustomers();renderMailing();};
window.blastSkip=()=>{const b=currentBlast();const idx=nextPending(b);if(idx<0)return;b.recipients[idx].status="skipped";b.skipCount++;saveBlasts();renderBlastSheet();};
window.blastOptOut=(id)=>{const c=getCustomer(id);c.optOut=true;c.optOutAt=todayISO();const b=currentBlast();const idx=nextPending(b);if(idx>=0)b.recipients[idx].status="removed";saveCustomers();saveBlasts();renderBlastSheet();renderCustomers();renderMailing();};
window.blastOverride=()=>{const b=currentBlast();b.capBonus=(b.capBonus||0)+SETTINGS.mailing.dailyCap;saveBlasts();renderBlastSheet();};

/* ---------- Nav & init ---------- */
const TITLES={leads:["לידים","מוצרי שיער"],pipeline:["Pipeline","מעקב לפי שלבים"],
  customers:["לקוחות","המאגר הארצי"],mailing:["דיוור","שליחה מפולחת בוואטסאפ"],reports:["דוחות","סיכום ונתונים"]};
let currentScreen="leads";
function go(name){
  currentScreen=name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("s-"+name).classList.add("active");
  document.querySelectorAll(".nav-b").forEach(b=>b.classList.toggle("on",b.dataset.go===name));
  document.getElementById("hTitle").textContent=TITLES[name][0];
  document.getElementById("hSub").textContent=TITLES[name][1];
  const fab=document.getElementById("fab");
  fab.style.display=(name==="leads"||name==="customers")?"flex":"none";
  document.querySelector("main").scrollTop=0; window.scrollTo(0,0);
}
document.querySelectorAll(".nav-b").forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById("fab").onclick=()=>{ if(currentScreen==="customers") openCustomer(null); else editLead(null); };
document.getElementById("bellBtn").onclick=()=>{go("leads");toast(LEADS.filter(needsToday).length+" לידים לטיפול היום");};
document.getElementById("setBtn").onclick=()=>openSettings();

/* ---------- Settings & backup ---------- */
function openSettings(){
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-top">
      <div style="font-weight:600;font-size:16px">הגדרות</div>
      <button class="x" onclick="closeSheet()">✕</button>
    </div>
    <div class="d-pad">
      <div class="lbl-s">רשימת מוצרים (שורה לכל מוצר)</div>
      <textarea class="note-input" id="setProducts" style="min-height:110px">${esc(PRODUCTS.join("\n"))}</textarea>
      <div class="lbl-s">רשימת קמפיינים (שורה לכל קמפיין)</div>
      <textarea class="note-input" id="setCampaigns" style="min-height:90px">${esc(CAMPAIGNS.join("\n"))}</textarea>
      <div class="row-g" style="margin-top:14px">
        <button class="btn btn-primary" onclick="applySettings()">שמור רשימות</button>
      </div>

      <div class="lbl-s" style="margin-top:24px">גיבוי נתונים</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">שמור קובץ גיבוי של כל הנתונים (לידים, לקוחות, תבניות) למחשב/טלפון, או שחזר מקובץ.</div>
      <div class="row-g">
        <button class="btn btn-ghost" onclick="exportData()">📤 ייצוא גיבוי</button>
        <button class="btn btn-ghost" onclick="document.getElementById('impFile').click()">📥 ייבוא גיבוי</button>
      </div>
      <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importData(this)">

      <div class="lbl-s" style="margin-top:24px">איפוס</div>
      <div class="row-g">
        <button class="btn btn-ghost" style="color:var(--new)" onclick="resetDemo()">↺ אפס לנתוני דוגמה</button>
      </div>
      <div style="font-size:12px;color:var(--faint);margin-top:18px;text-align:center">גרסה 1 · הנתונים נשמרים במכשיר זה. בקרוב: סנכרון בענן.</div>
    </div>`;
  document.getElementById("sheetBg").classList.add("open");
}
window.applySettings=()=>{
  const p=document.getElementById("setProducts").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const c=document.getElementById("setCampaigns").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(p.length)SETTINGS.products=p; if(c.length)SETTINGS.campaigns=c;
  PRODUCTS=SETTINGS.products; CAMPAIGNS=SETTINGS.campaigns;
  saveSettings(); renderAll(); toast("הרשימות נשמרו");
};
window.exportData=()=>{
  const data=JSON.stringify({leads:LEADS,customers:CUSTOMERS,templates:TEMPLATES,blasts:BLASTS,settings:SETTINGS,exportedAt:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="crm-backup-"+todayISO()+".json";
  document.body.appendChild(a);a.click();a.remove();
  toast("קובץ הגיבוי ירד");
};
window.importData=(input)=>{
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.leads&&!obj.customers)throw new Error("bad");
      if(!confirm("לשחזר גיבוי? זה יחליף את כל הנתונים הנוכחיים."))return;
      if(Array.isArray(obj.leads))LEADS=obj.leads;
      if(Array.isArray(obj.customers))CUSTOMERS=obj.customers;
      if(Array.isArray(obj.templates)&&obj.templates.length)TEMPLATES=obj.templates;
      if(Array.isArray(obj.blasts))BLASTS=obj.blasts;
      if(obj.settings){SETTINGS=Object.assign(SETTINGS,obj.settings);PRODUCTS=SETTINGS.products;CAMPAIGNS=SETTINGS.campaigns;saveSettings();}
      save();saveCustomers();saveTemplates();saveBlasts(); renderAll(); closeSheet(); toast("שוחזר בהצלחה");
    }catch(e){toast("קובץ לא תקין");}
  };
  r.readAsText(f); input.value="";
};
window.resetDemo=()=>{
  if(!confirm("לאפס את כל הנתונים ולחזור לנתוני דוגמה?"))return;
  LEADS=seed(); CUSTOMERS=seedCustomers(); BLASTS=[]; TEMPLATES=defaultTemplates();
  save(); saveCustomers(); saveBlasts(); saveTemplates(); renderAll(); closeSheet(); toast("אופס לנתוני דוגמה");
};

function renderAll(){renderLeads();renderPipeline();renderCustomers();renderMailing();renderReports();}
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

renderAll();

/* single-file build: service worker omitted */
</script>
</body>
</html>
